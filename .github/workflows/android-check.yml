name: Validate Android APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: unzip -q ToonShelf_Android_Source.zip
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: android_app
      - run: npx cap sync android
        working-directory: android_app
      - run: chmod +x gradlew && ./gradlew testDebugUnitTest lintRelease assembleRelease --no-daemon
        working-directory: android_app/android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-validation
          path: |
            android_app/android/app/build/outputs/apk/release/*.apk
            android_app/android/app/build/reports/
          retention-days: 7

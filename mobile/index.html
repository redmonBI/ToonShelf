<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7fb"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="referrer" content="no-referrer"><title>ToonShelf Mobile</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="stylesheet" href="./style.css"></head><body>
<header id="appbar"><a class="brand" href="./">ToonShelf<span>Mobile</span></a><button id="install">앱 설치</button><button id="settings">설정</button></header>
<main id="home"><p class="eyebrow">MY STORIES · 3.7.3</p><h1>오늘, 이어지는 이야기.</h1><p class="hint">나의 목록과 이 기기에 보관한 작품을 한곳에서.</p>
<nav class="tabs" id="tabs" aria-label="라이브러리 분류"><button data-scope="all" class="selected">전체</button><button data-scope="recent">최근 회차</button><button data-scope="full">전회차</button><button data-scope="pending">다운로드 전</button></nav>
<div class="searchrow"><input id="search" placeholder="작품 검색" aria-label="작품 검색"><button id="import">파일 가져오기</button></div>
<div class="folderrow"><button id="selectFolder">대표 폴더 불러오기</button><button id="rescanFolder" hidden>폴더 새로고침</button><span id="folderStatus" role="status"></span></div>
<fieldset id="days"><legend>연재 요일 · 여러 개 선택 가능</legend><label><input type="checkbox" id="allDays" checked>전체</label></fieldset>
<div class="filters"><input id="publisher" placeholder="제공처"><input id="genre" placeholder="장르"><select id="dateKind" aria-label="날짜 기준"><option value="updated_date">최근 업로드일</option><option value="last_downloaded">가져온 날짜</option></select><input type="date" id="from" aria-label="시작 날짜"><input type="date" id="to" aria-label="종료 날짜"></div>
<div class="folderrow"><label><input type="checkbox" id="favoriteOnly">즐겨찾기만</label><select id="sortWorks" aria-label="작품 정렬"><option value="default">기본순</option><option value="name">작품명</option><option value="date">최근 업로드</option><option value="favorite">즐겨찾기 우선</option></select></div><div class="summary"><span id="count">0개 작품</span><span id="storage">기기 저장 공간 확인 중</span></div><section id="grid" aria-live="polite"></section><nav id="pagination" class="tabs" aria-label="페이지 이동"></nav></main>
<section id="reader" hidden><header id="readerbar"><button id="back">목록</button><span id="readerTitle"></span><button id="prev">이전</button><select id="chapter" aria-label="회차 선택"></select><button id="next">다음</button><button id="readerSettings">설정</button><button id="hidebar">숨김</button></header><button id="restorebar" hidden>메뉴</button><div id="pages"></div><footer><button id="nextBottom">다음 회차</button></footer></section>
<dialog id="panel"><form id="panelForm"><div class="dialoghead"><h2 id="panelTitle"></h2><button type="button" id="closePanel" aria-label="닫기">닫기</button></div><div id="panelBody"></div><p id="panelStatus" role="status"></p></form></dialog>
<dialog id="busy"><h2 id="busyTitle">불러오는 중</h2><progress id="progress" max="100"></progress><p id="busyText" role="status"></p><button id="cancelImport">취소</button></dialog><div id="toast" role="status" hidden></div>
<input type="file" id="files" hidden multiple accept=".cbz,.zip,.json,image/png,image/jpeg,image/webp,image/gif,image/avif"><input type="file" id="directoryFiles" hidden webkitdirectory multiple><script type="module" src="./app.js"></script></body></html>
